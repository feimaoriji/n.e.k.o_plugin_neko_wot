name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-randomly ruff==0.12.4

      - name: Lint (ruff)
        run: |
          ruff check --ignore-noqa --isolated --no-respect-gitignore \
            --target-version py311 --line-length 120 --select E4,E7,E9,F,I \
            --exclude .venv --exclude __pycache__ --exclude .ruff_cache .

      - name: Test (pytest)
        run: |
          python -m pytest tests -q --tb=short -p no:cacheprovider
